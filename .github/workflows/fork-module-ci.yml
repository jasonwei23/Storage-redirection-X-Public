name: Fork 代码检查

on:
  pull_request:
    branches: [SRX-R]
  push:
    branches: [SRX-R, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-module-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    # fork 自动同步仅执行代码验证，不编译或打包 Android 模块。
    if: github.repository == 'jasonwei23/Storage-redirection-X-Public'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装固定 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: clippy, rustfmt

      - name: 执行仓库回归与格式检查
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p native-config-fixtures --locked
          python -m unittest discover -s .github/tests -p 'test_*.py' -v
          node scripts/verify-webui-structure.js
          node scripts/verify-webui-config-fixtures.js
          node scripts/verify-webui-app-list-parser.js

      - name: 检查增量代码质量
        shell: pwsh
        run: |
          $baseRef = '${{ github.event.pull_request.base.sha || github.event.before }}'
          if ([string]::IsNullOrWhiteSpace($baseRef) -or $baseRef -match '^0+$') {
            $baseRef = 'HEAD^'
          }
          ./scripts/validate-inline-tests.ps1 -Ref HEAD
          ./scripts/validate-code-quality.ps1 -BaseRef $baseRef -Ref HEAD
